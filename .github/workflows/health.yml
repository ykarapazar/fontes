# Daily source health check. GitHub's copy is the canonical status history: each run
# commits research/health/<date>.json, docs/HEALTH.md and docs/status/index.html to the
# branch, so the GitHub Pages status page (source: main, /docs -> /status/) and the local
# page (scripts/health_daily.sh builds it from origin/main) show the same data.
# The run fails (owner notification) when a source is down/blocked two runs in a row after
# being up: a one-day outage of a flaky site shows on the page but does not alert.
# Note: runners sit in US data centres; a few sources geo-block or answer slower there.
# Pages needs a public repo (or a paid plan); until then the page lives in the repo only.
name: source-health

on:
  schedule:
    - cron: "17 5 * * *"     # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync
      - name: Check every source
        id: check
        env:
          WLM_US_GOVINFO_KEY: ${{ secrets.WLM_US_GOVINFO_KEY }}
        run: |
          new="research/health/$(date -u +%F).json"
          prev=$(ls research/health/????-??-??.json 2>/dev/null | grep -v "$new" | sort | tail -n 1)
          prev2=$(ls research/health/????-??-??.json 2>/dev/null | grep -v "$new" | sort | tail -n 2 | head -n 1)
          [ "$prev2" = "$prev" ] && prev2=
          set +e
          uv run python scripts/health.py --json "$new" --md docs/HEALTH.md ${prev:+--prev "$prev"} ${prev2:+--prev2 "$prev2"}
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e
          uv run python scripts/status_page.py --history research/health --out docs/status/index.html
      - name: Commit the report and the status page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/health/????-??-??.json docs/HEALTH.md docs/status/index.html
          git diff --cached --quiet || git commit -q -m "health: $(date -u +%F)"
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
      - name: Fail when a source newly broke
        if: steps.check.outputs.rc != '0'
        run: exit 1
